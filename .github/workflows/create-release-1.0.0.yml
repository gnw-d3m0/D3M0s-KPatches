name: Create 1.0.0 Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Create 1.0.0 release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 1.0.0 \
            K1HighFPSFixes/K1HighFPSFixes.kpatch \
            --target "$GITHUB_SHA" \
            --title "1.0.0" \
            --notes "K1 High FPS Fix 1.0.0 for Kotor Patch Manager 0.6.3."
