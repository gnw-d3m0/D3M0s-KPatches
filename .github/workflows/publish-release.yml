name: Publish v0.1.0 release

on:
  push:
    branches:
      - release-v0.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 \
            release-assets/DialogueLetterboxFix.kpatch \
            release-assets/PostCombatFix.kpatch \
            release-assets/PostCombatFix60fps.kpatch \
            --repo "${{ github.repository }}" \
            --target main \
            --title "KOTOR 1 High FPS Fixes v0.1.0" \
            --notes "Initial release of the KOTOR 1 high-FPS fixes for Kotor Patch Manager 0.6.3. Includes DialogueLetterboxFix, PostCombatFix, and PostCombatFix60fps. Only use one of the two post-combat variants at a time."
