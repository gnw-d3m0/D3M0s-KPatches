name: Create 0.2.0 Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Replace DLL-backed patches with source-backed builds'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 0.2.0 \
            DialogueLetterboxFix/DialogueLetterboxFix.kpatch \
            PostCombatFix/PostCombatFix.kpatch \
            PostCombatFix60fps/PostCombatFix60fps.kpatch \
            FreeLookMouseSensitivityFix/FreeLookMouseSensitivityFix.kpatch \
            HighFPSAnimationFixes/HighFPSAnimationFixes.kpatch \
            LightsaberTrailHighFPSFix/LightsaberTrailHighFPSFix.kpatch \
            TreeLeavesHighFPSFix/TreeLeavesHighFPSFix.kpatch \
            WaterForceFieldHighFPSFix/WaterForceFieldHighFPSFix.kpatch \
            --target "$GITHUB_SHA" \
            --title "0.2.0" \
            --notes "KOTOR 1 high-FPS fixes for Kotor Patch Manager 0.6.3."
