name: Restore exact K1HighFPSFixes DLL

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore-dll:
    if: github.event.head_commit.message == 'Stage exact K1HighFPSFixes DLL'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract DLL from KPatch
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('K1HighFPSFixes/K1HighFPSFixes.kpatch') as z:
              data = z.read('binaries/windows_x86.dll')
          if len(data) != 3584:
              raise SystemExit(f'Unexpected DLL size: {len(data)}')
          open('K1HighFPSFixes/src/dll/windows_x86.dll', 'wb').write(data)
          PY
          echo '0faeba4edd5c578fdce89d8563b214cada6ab4b3de02ba810ea323b521a58ddf  K1HighFPSFixes/src/dll/windows_x86.dll' | sha256sum -c -
      - name: Commit exact DLL
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add K1HighFPSFixes/src/dll/windows_x86.dll
          git commit -m 'Extract exact K1HighFPSFixes DLL'
          git push
